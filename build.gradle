plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'de.coincraft'
base { archivesName = "apx-${mod_id}-neoforge-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
            systemProperty 'mapzones.debug', 'true'
            if (project.hasProperty('quickWorld')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickWorld').toString()
            }
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArguments.addAll '--nogui'
        }
    }
}

dependencies {
    // Xaero's World Map wird nur zum Kompilieren gebraucht (Highlighter-API + Mixin-Targets).
    compileOnly files('libs/xaeroworldmap-neoforge-1.21.1-1.47.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def expandProps = [
        mod_id: mod_id,
        mod_version: mod_version,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version
    ]
    inputs.properties expandProps
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Implementation-Title'  : mod_id,
            'Implementation-Version': project.version
        ])
    }
}

// ---------------------------------------------------------------------------
// Zwei Varianten aus einer Codebasis:
//   jar        -> apx-mapzones-...         ohne Rechteverwaltung
//   protectJar -> apx-mapzones-protect-... mit Rechteverwaltung
// Unterschied sind nur zwei Ressourcen: mapzones-features.json und der
// Anzeigename in der neoforge.mods.toml. Die Mod-ID bleibt gleich, damit immer
// nur eine der beiden Varianten installiert sein kann.
// ---------------------------------------------------------------------------

def protectResources = layout.buildDirectory.dir('variant/protect')

def generateProtectResources = tasks.register('generateProtectResources') {
    outputs.dir(protectResources)
    doLast {
        def dir = protectResources.get().asFile
        dir.deleteDir()
        new File(dir, 'META-INF').mkdirs()
        new File(dir, 'mapzones-features.json').text = """{
  "protection": true
}
"""
        def toml = file('src/main/resources/META-INF/neoforge.mods.toml').text
            .replace('${mod_id}', mod_id)
            .replace('${mod_version}', mod_version)
            .replace('displayName = "APX Map Zones"', 'displayName = "APX Map Zones (Protect)"')
        new File(dir, 'META-INF/neoforge.mods.toml').text = toml
    }
}

tasks.register('protectJar', Jar) {
    dependsOn generateProtectResources
    archiveBaseName = "apx-${mod_id}-protect-neoforge-${minecraft_version}"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Variantendateien zuerst, damit sie die Standardressourcen verdraengen.
    from(protectResources)
    from(sourceSets.main.output)
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Implementation-Title'  : mod_id,
            'Implementation-Version': project.version
        ])
    }
}

tasks.named('build') {
    dependsOn 'protectJar'
}
